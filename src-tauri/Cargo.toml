[package]
name = "arklight-playground"
version = "0.1.0"
description = "Native shell for the ARKlight Playground workbench"
edition = "2021"
rust-version = "1.77"

# Stage 1 only: this crate does nothing but open a window pointed at the
# same workbench the browser build serves. No filesystem IPC, no
# replacement for backend/app.py yet -- see docs/TAURI-ROADMAP.md.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "arklight-playground"
path = "src/main.rs"
